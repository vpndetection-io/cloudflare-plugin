name: Release

# The tag is the release: the Deploy to Cloudflare button copies main, so there is nothing to build or
# upload. This publishes the version's CHANGELOG.md section as the tag's GitHub Release, and a re-run
# edits the release rather than failing on it.
on:
  push:
    tags: ['v*']

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag names package.json's version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$(jq -r .version package.json)" = "$v" ] || { echo "${GITHUB_REF_NAME} is not package.json's version"; exit 1; }
      - name: GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{ if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if ! grep -q '^### ' notes.md ; then
            echo "CHANGELOG.md has no section for ${v}" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
